name: ddev-emvicy2xdev
networks:
    ddev_default:
        external: true
        name: ddev_default
    default:
        labels:
            com.ddev.platform: ddev
        name: ddev-emvicy2xdev_default
services:
    db:
        build:
            args:
                BASE_IMAGE: ddev/ddev-dbserver-mariadb-10.11:v1.24.2
                gid: "1000"
                uid: "1000"
                username: admin1
            context: /tmp/foo/Emvicy_2.x/.ddev/.dbimageBuild
            dockerfile: Dockerfile
        cap_add:
            - SYS_NICE
        command: []
        container_name: ddev-Emvicy2xDev-db
        environment:
            BITNAMI_VOLUME_DIR: ""
            COLUMNS: "316"
            DDEV_DATABASE: mariadb:10.11
            DDEV_DATABASE_FAMILY: mysql
            DDEV_GOARCH: amd64
            DDEV_GOOS: linux
            DDEV_HOSTNAME: emvicy2xdev.ddev.site
            DDEV_PHP_VERSION: "8.4"
            DDEV_PRIMARY_URL: https://emvicy2xdev.ddev.site
            DDEV_PROJECT: Emvicy2xDev
            DDEV_PROJECT_TYPE: php
            DDEV_ROUTER_HTTP_PORT: "80"
            DDEV_ROUTER_HTTPS_PORT: "443"
            DDEV_SITENAME: Emvicy2xDev
            DDEV_TLD: ddev.site
            DOCKER_IP: 127.0.0.1
            HOST_DOCKER_INTERNAL_IP: ""
            IS_DDEV_PROJECT: "true"
            LINES: "79"
            MYSQL_HISTFILE: /mnt/ddev-global-cache/mysqlhistory/Emvicy2xDev-db/mysql_history
            PAGER: less -SFX
            PGDATABASE: db
            PGHOST: 127.0.0.1
            PGPASSWORD: db
            PGUSER: db
            POSTGRES_DB: db
            POSTGRES_PASSWORD: db
            POSTGRES_USER: db
            TZ: Europe/Berlin
            USER: admin1
        healthcheck:
            interval: 1s
            retries: 70
            start_interval: 1s
            start_period: 2m0s
            timeout: 1m10s
        hostname: Emvicy2xDev-db
        image: ddev/ddev-dbserver-mariadb-10.11:v1.24.2-Emvicy2xDev-built
        labels:
            com.ddev.app-type: php
            com.ddev.approot: /tmp/foo/Emvicy_2.x
            com.ddev.platform: ddev
            com.ddev.site-name: Emvicy2xDev
        networks:
            ddev_default: null
            default: null
        ports:
            - host_ip: 127.0.0.1
              mode: ingress
              protocol: tcp
              target: 3306
        restart: "no"
        stop_grace_period: 1m0s
        user: 1000:1000
        volumes:
            - source: database
              target: /var/lib/mysql
              type: volume
              volume:
                nocopy: true
            - bind:
                create_host_path: true
              source: /tmp/foo/Emvicy_2.x/.ddev
              target: /mnt/ddev_config
              type: bind
            - bind:
                create_host_path: true
              source: /tmp/foo/Emvicy_2.x/.ddev/db_snapshots
              target: /mnt/snapshots
              type: bind
            - source: ddev-global-cache
              target: /mnt/ddev-global-cache
              type: volume
              volume: {}
        working_dir: /home/admin1
    phpmyadmin:
        container_name: ddev-Emvicy2xDev-phpmyadmin
        depends_on:
            db:
                condition: service_started
                required: true
        environment:
            HTTP_EXPOSE: 8036:80
            HTTPS_EXPOSE: 8037:80
            PMA_HOST: db
            PMA_PASSWORD: root
            PMA_PORT: "3306"
            PMA_USER: root
            UPLOAD_LIMIT: 4000M
            VIRTUAL_HOST: emvicy2xdev.ddev.site
        expose:
            - "80"
        healthcheck:
            interval: 2m0s
            retries: 1
            timeout: 2s
        image: phpmyadmin:5.2.0
        labels:
            com.ddev.approot: /tmp/foo/Emvicy_2.x
            com.ddev.site-name: Emvicy2xDev
        networks:
            ddev_default: null
            default: null
        restart: "no"
        volumes:
            - bind:
                create_host_path: true
              source: /tmp/foo/Emvicy_2.x/.ddev
              target: /mnt/ddev_config
              type: bind
            - source: ddev-global-cache
              target: /mnt/ddev-global-cache
              type: volume
              volume: {}
        working_dir: /root
    web:
        build:
            args:
                BASE_IMAGE: ddev/ddev-webserver:v1.24.2
                DDEV_DATABASE: mariadb:10.11
                DDEV_PHP_VERSION: "8.4"
                gid: "1000"
                uid: "1000"
                username: admin1
            context: /tmp/foo/Emvicy_2.x/.ddev/.webimageBuild
            dockerfile: Dockerfile
        cap_add:
            - SYS_PTRACE
        command:
            - /pre-start.sh
        container_name: ddev-Emvicy2xDev-web
        environment:
            COLUMNS: "316"
            COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
            COREPACK_HOME: /mnt/ddev-global-cache/corepack
            DDEV_COMPOSER_ROOT: /var/www/html
            DDEV_DATABASE: mariadb:10.11
            DDEV_DATABASE_FAMILY: mysql
            DDEV_DOCROOT: public
            DDEV_FILES_DIR: ""
            DDEV_FILES_DIRS: ""
            DDEV_GOARCH: amd64
            DDEV_GOOS: linux
            DDEV_HOSTNAME: emvicy2xdev.ddev.site
            DDEV_MUTAGEN_ENABLED: "false"
            DDEV_PHP_VERSION: "8.4"
            DDEV_PRIMARY_URL: https://emvicy2xdev.ddev.site
            DDEV_PROJECT: Emvicy2xDev
            DDEV_PROJECT_TYPE: php
            DDEV_ROUTER_HTTP_PORT: "80"
            DDEV_ROUTER_HTTPS_PORT: "443"
            DDEV_SITENAME: Emvicy2xDev
            DDEV_TLD: ddev.site
            DDEV_VERSION: v1.24.2
            DDEV_WEB_ENTRYPOINT: /mnt/ddev_config/web-entrypoint.d
            DDEV_WEBSERVER_TYPE: apache-fpm
            DDEV_XDEBUG_ENABLED: "false"
            DEPLOY_NAME: local
            DOCKER_IP: 127.0.0.1
            DOCROOT: public
            DRUSH_OPTIONS_URI: https://emvicy2xdev.ddev.site
            HOST_DOCKER_INTERNAL_IP: ""
            HTTP_EXPOSE: 80:80,8025:8025,7999:8000
            HTTPS_EXPOSE: 443:80,8026:8025,8000:8000
            IS_DDEV_PROJECT: "true"
            LINES: "79"
            MYSQL_HISTFILE: /mnt/ddev-global-cache/mysqlhistory/Emvicy2xDev-web/mysql_history
            NODE_EXTRA_CA_CERTS: /mnt/ddev-global-cache/mkcert/rootCA.pem
            PAGER: less -SFX
            PGDATABASE: db
            PGHOST: db
            PGPASSWORD: db
            PGUSER: db
            PHP_IDE_CONFIG: serverName=Emvicy2xDev.ddev.site
            SSH_AUTH_SOCK: /home/.ssh-agent/socket
            START_SCRIPT_TIMEOUT: "30"
            TZ: Europe/Berlin
            USER: admin1
            VIRTUAL_HOST: emvicy2xdev.ddev.site
            npm_config_cache: /mnt/ddev-global-cache/npm
        expose:
            - "8000"
        external_links:
            - ddev-router:emvicy2xdev.ddev.site
            - ddev-router:msp1x.ddev.site
            - ddev-router:ikp4x.ddev.site
            - ddev-router:cds1x.ddev.site
            - ddev-router:cdm2x.ddev.site
        extra_hosts:
            - host.docker.internal=host-gateway
        healthcheck:
            interval: 1s
            retries: 70
            start_interval: 1s
            start_period: 2m0s
            timeout: 1m10s
        hostname: Emvicy2xDev-web
        image: ddev/ddev-webserver:v1.24.2-Emvicy2xDev-built
        labels:
            com.ddev.app-type: php
            com.ddev.approot: /tmp/foo/Emvicy_2.x
            com.ddev.platform: ddev
            com.ddev.site-name: Emvicy2xDev
        networks:
            ddev_default: null
            default: null
        ports:
            - host_ip: 127.0.0.1
              mode: ingress
              protocol: tcp
              target: 80
            - host_ip: 127.0.0.1
              mode: ingress
              protocol: tcp
              target: 443
        restart: "no"
        user: 1000:1000
        volumes:
            - consistency: cached
              source: /tmp/foo/Emvicy_2.x
              target: /var/www/html
              type: bind
            - bind:
                create_host_path: true
              read_only: true
              source: /tmp/foo/Emvicy_2.x/.ddev
              target: /mnt/ddev_config
              type: bind
            - bind:
                create_host_path: true
              source: /tmp/foo/Emvicy_2.x/.ddev/xhprof
              target: /usr/local/bin/xhprof
              type: bind
            - source: ddev-global-cache
              target: /mnt/ddev-global-cache
              type: volume
              volume: {}
            - source: ddev-ssh-agent_socket_dir
              target: /home/.ssh-agent
              type: volume
              volume: {}
        working_dir: /var/www/html/
volumes:
    database:
        external: true
        name: Emvicy2xDev-mariadb
    ddev-global-cache:
        external: true
        name: ddev-global-cache
    ddev-ssh-agent_socket_dir:
        external: true
        name: ddev-ssh-agent_socket_dir
